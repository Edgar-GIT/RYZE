name: Deploy

# Push to "staging" -> staging (api-staging.<domain>, staging.<domain>).
# Push to "main"    -> production (api.<domain>, <domain>), after a person
#                      approves it in the "production" GitHub Environment.
#
# Order: all tests (ci.yml) -> API image to GHCR -> API on the VPS (backup,
# migrations, health check, automatic rollback of the API image) -> web app
# to Cloudflare Pages. If any step fails, the next ones do not run, so the
# web app never goes live ahead of the API it needs.
#
# Nothing here works until the one-time setup in production.MD (section 11)
# is done: GitHub Environments "staging" and "production" with their secrets
# and variables, the VPS "deploy" user, and the Cloudflare Pages project.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# One deploy per branch at a time; a newer push waits instead of racing.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  image:
    name: API image (GHCR)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$(node -p "require('./package.json').version")"
          tag="${version}-${GITHUB_SHA::12}"
          echo "image=ghcr.io/${owner}/ryze-api" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: main/src/backend
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend:
    name: API on the VPS
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      # The private key and the server's host key come from the Environment's
      # secrets; the host key is checked (no "accept any host").
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
          TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" "/opt/ryze/deploy/deploy.sh ${TARGET} ${TAG}"

      - name: Public health check
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: curl -fsS --retry 5 --retry-delay 5 "${API_BASE_URL}/health"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  frontend:
    name: Web app (Cloudflare Pages)
    needs: backend
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      # VITE_API_BASE_URL is baked into the bundle (e.g.
      # https://api.ryzecoaching.com/api/v1); it is not a secret.
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ryze' }} --branch=${{ github.ref_name }}
