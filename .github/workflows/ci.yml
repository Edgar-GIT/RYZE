name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so feedback reflects the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, build, vet, unit tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: main/src/backend/go.mod
          cache-dependency-path: main/src/backend/go.sum

      - name: Verify formatting
        working-directory: main/src/backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Build
        working-directory: main/src/backend
        run: go build ./...

      - name: Vet
        working-directory: main/src/backend
        run: go vet ./...

      # Database-backed packages are intentionally excluded: they require a
      # provisioned MariaDB. This job stays green and catches build, vet,
      # formatting, race and dependency-free test regressions; the full suite
      # (including database-backed packages) is exercised in the deployment
      # pipeline against a provisioned database.
      - name: Unit tests (database-independent, race detector)
        working-directory: main/src/backend
        run: go test -race ./config/... ./middleware/... ./version/... ./services/token/... ./services/contact/... ./services/public_programs/...

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
