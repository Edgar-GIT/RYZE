# RYZE production-like stack.
#
# Prerequisites:
#   cp .env.example .env    # then fill in every required value
#
# Start:
#   docker compose up -d --build
#   docker compose run --rm backend migrate up
#
# The database is not published to the host: only the backend can reach it.
# The frontend is published on :80 and proxies /api/ to the backend on :8080.

name: ryze

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # The application role owns the database, so it can create the trusted
      # citext extension the migrations use.
      POSTGRES_DB: ${DB_NAME:-ryze}
      POSTGRES_USER: ${DB_USER:-ryze_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./main/src/backend
      args:
        VERSION: ${RYZE_VERSION:-dev}
    restart: unless-stopped
    # The API drains in-flight requests for up to SERVER_SHUTDOWN_TIMEOUT
    # (default 20s); Docker must not SIGKILL it before that finishes.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the local .env host so the API reaches the compose database.
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      PORT: "8080"
      # nginx forwards the real client address; the backend must trust only the
      # compose network or every rate limiter would see the proxy's IP.
      RATE_LIMIT_TRUSTED_PROXIES: ${RYZE_DOCKER_SUBNET:-172.30.0.0/24}
      TRAINER_EVIDENCE_DIR: /var/lib/ryze/trainer-evidence
    volumes:
      - backend_data:/var/lib/ryze
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: main/src/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

networks:
  default:
    ipam:
      config:
        - subnet: ${RYZE_DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  db_data:
  backend_data:
