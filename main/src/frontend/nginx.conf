# The API is reached through the same origin as the page, so the browser sends
# the session cookie first-party and no CORS exception is required. nginx only
# serves static assets and forwards /api/ to the backend service.
#
# TLS is terminated by the deployment's HTTPS proxy in front of this container.
# HSTS is emitted here so it reaches the browser through that proxy.
server {
    listen 80;
    server_name _;

    server_tokens off;
    # Covers the maximum configurable evidence document (25 MiB) plus multipart
    # overhead and the contact form's 1 MiB attachment allowance.
    client_max_body_size 26m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths fall back to the single-page app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
